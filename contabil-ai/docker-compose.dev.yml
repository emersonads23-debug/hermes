version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contabilai-backend-dev
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - NODE_ENV=development
      - EVOLUTION_API_URL=http://evolution:8080
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - uploads:/app/uploads
      - logs:/app/logs
    command: npx nodemon src/server.js
    depends_on:
      - redis
      - n8n
      - evolution
    networks:
      - contabilai

  redis:
    image: redis:7-alpine
    container_name: contabilai-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - contabilai

  n8n:
    image: n8nio/n8n:latest
    container_name: contabilai-n8n-dev
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin}
      - WEBHOOK_URL=http://n8n:5678
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - BACKEND_API_URL=http://backend:3000
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - contabilai

  evolution:
    image: atendai/evolution-api:latest
    container_name: contabilai-evolution-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-dev-api-key}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - WEBHOOK_GLOBAL_URL=http://backend:3000/api/webhook/evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - CONFIG_SESSION_PHONE_CLIENT=ContabilAI
      - CONFIG_SESSION_PHONE_NAME=Chrome
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - contabilai

volumes:
  uploads:
  logs:
  redis_data:
  n8n_data:
  evolution_data:

networks:
  contabilai:
    driver: bridge

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contabilai-backend-dev
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - uploads:/app/uploads
    command: npx nodemon src/server.js
    networks:
      - contabilai

  n8n:
    image: n8nio/n8n:latest
    container_name: contabilai-n8n-dev
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - WEBHOOK_URL=http://localhost:5678
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - BACKEND_API_URL=http://backend:3000
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - contabilai

  evolution:
    image: atendai/evolution-api:latest
    container_name: contabilai-evolution-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=dev-api-key
      - WEBHOOK_GLOBAL_URL=http://n8n:5678/webhook/evolution-webhook
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - contabilai

volumes:
  uploads:
  n8n_data:
  evolution_data:

networks:
  contabilai:
    driver: bridge

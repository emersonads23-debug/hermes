services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contabilai-backend
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
      - ./database:/database
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - EVOLUTION_API_URL=http://evolution:8080
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook
    depends_on:
      redis:
        condition: service_healthy
      n8n:
        condition: service_started
    networks:
      - contabilai

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: contabilai-worker
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - contabilai
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: contabilai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - contabilai

  redis:
    image: redis:7-alpine
    container_name: contabilai-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-}
    # Redis not exposed to host in production — only internal Docker network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contabilai

  n8n:
    image: n8nio/n8n:latest
    container_name: contabilai-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:?N8N_PASSWORD must be set}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - BACKEND_API_URL=http://backend:3000
      - SMTP_FROM=${EMAIL_FROM:-ContabilAI <noreply@contabilai.com>}
      - ESCALATION_EMAIL=${ESCALATION_EMAIL:-}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - contabilai

  evolution:
    image: atendai/evolution-api:latest
    container_name: contabilai-evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?EVOLUTION_API_KEY must be set}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=sqlite
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - WEBHOOK_GLOBAL_URL=http://backend:3000/api/webhook/evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - CONFIG_SESSION_PHONE_CLIENT=ContabilAI
      - CONFIG_SESSION_PHONE_NAME=Chrome
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - contabilai

volumes:
  uploads:
  logs:
  redis_data:
  n8n_data:
  evolution_data:

networks:
  contabilai:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: "172.28.0.0/16"
        - subnet: "fd00:dead:beef::/48"
